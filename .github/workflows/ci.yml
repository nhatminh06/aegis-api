name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Read-only by default; the publish job elevates only what it needs.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./... -v
      - run: go build ./...

  # Only runs on an explicit version tag, not on every push to main: this
  # is what turns a commit into a released, deployable artifact, and that
  # should be a deliberate act, not a side effect of merging.
  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # QEMU + multi-platform: the runner is amd64, but dev/home clusters
      # in this project run on arm64 (Apple Silicon, and likely arm64
      # single-board hardware later) — an amd64-only image silently fails
      # to schedule there with no matching manifest, discovered by trying
      # to pull v0.1.0 locally before it ever reached the cluster.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ghcr.io/nhatminh06/aegis-api:${{ github.ref_name }}
      - name: Record published digest
        run: |
          echo "Published ghcr.io/nhatminh06/aegis-api@${{ steps.build.outputs.digest }}"
