name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Test/build only. No registry, no signing — that surface lives entirely
# in release.yml, gated behind a version tag rather than every push.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./... -v
      - run: go build ./...
