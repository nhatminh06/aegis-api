name: wrong-signer-test

# TEMPORARY — exists only to produce one real, differently-identified
# keyless signature on an already-published digest, to prove Kyverno's
# verify-aegis-api-image policy rejects a signer that isn't
# release.yml. Not triggered automatically; not part of the normal
# pipeline. Removed after the test evidence is captured.
on:
  workflow_dispatch:
    inputs:
      digest:
        required: true
        type: string

permissions:
  contents: read

jobs:
  sign-from-wrong-workflow:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.6.5"
      - run: cosign sign --yes "ghcr.io/nhatminh06/aegis-api@${{ inputs.digest }}"
