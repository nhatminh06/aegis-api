name: release

# Only a version tag triggers this — pushing to main never publishes,
# scans, or signs anything. A release is a deliberate act.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only this job, only for pushing the image and its signature/SBOM
      # attestation to GHCR.
      packages: write
      # Only this job, only because Cosign keyless signing exchanges this
      # token for a short-lived Sigstore certificate. No other step in
      # this repository's CI needs it.
      id-token: write
    env:
      IMAGE: ghcr.io/nhatminh06/aegis-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the ancestry check below needs origin/main's
          # real commit graph, not the single tagged commit a shallow
          # clone would give.
          fetch-depth: 0

      # A tag can be pushed against any commit, including one that was
      # never merged. Refuse to release anything that isn't reachable
      # from main.
      - name: Verify the tagged commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "::error::${{ github.sha }} is not an ancestor of origin/main — refusing to release" >&2
            exit 1
          fi

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./... -v
      - run: go build ./...

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Published under a staging identity first, not the release tag.
      # Everything below — scan, SBOM, signature — is anchored to the
      # digest this step produces. The release tag is only ever attached
      # to that same digest later; nothing gets rebuilt in between.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}

      - name: Resolve platform child digests
        id: platforms
        run: |
          amd64=$(docker buildx imagetools inspect "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}" --format '{{json .}}' \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(m["digest"] for m in d["manifest"]["manifests"] if m["platform"]["architecture"]=="amd64"))')
          arm64=$(docker buildx imagetools inspect "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}" --format '{{json .}}' \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(m["digest"] for m in d["manifest"]["manifests"] if m["platform"]["architecture"]=="arm64"))')
          echo "amd64=${amd64}" >> "$GITHUB_OUTPUT"
          echo "arm64=${arm64}" >> "$GITHUB_OUTPUT"
          echo "Index digest: ${{ steps.build.outputs.digest }}"
          echo "linux/amd64:  ${amd64}"
          echo "linux/arm64:  ${arm64}"

      # Trivy scanned as a pinned tool container against the registry
      # image, not the Dockerfile or a local tag — the release gate has
      # to see exactly the bytes that will be signed and deployed. Both
      # platform manifests are scanned explicitly; a multi-platform index
      # is not "scanned" by inspecting only the runner's own architecture.
      - name: Trivy — linux/amd64
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD \
            aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --platform linux/amd64 --severity HIGH,CRITICAL --exit-code 1 --scanners vuln \
            "${{ env.IMAGE }}@${{ steps.platforms.outputs.amd64 }}"

      - name: Trivy — linux/arm64
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD \
            aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
            image --platform linux/arm64 --severity HIGH,CRITICAL --exit-code 1 --scanners vuln \
            "${{ env.IMAGE }}@${{ steps.platforms.outputs.arm64 }}"

      # One SBOM per platform child digest rather than one SBOM for the
      # index: Syft's inventory for a multi-arch index otherwise reflects
      # whichever platform it happened to resolve, and presenting that as
      # covering both would overstate what was actually catalogued.
      - name: Syft SBOM — linux/amd64
        run: |
          mkdir -p sbom
          docker run --rm \
            -v "$HOME/.docker/config.json:/root/.docker/config.json:ro" \
            -v "$PWD/sbom:/out" \
            anchore/syft@sha256:678bfa565b60f747aac0f8e964fe5588a24445b8d0a480e91f6efd70020dfbb0 \
            "registry:${{ env.IMAGE }}@${{ steps.platforms.outputs.amd64 }}" \
            -o spdx-json=/out/aegis-api-linux-amd64.spdx.json

      - name: Syft SBOM — linux/arm64
        run: |
          docker run --rm \
            -v "$HOME/.docker/config.json:/root/.docker/config.json:ro" \
            -v "$PWD/sbom:/out" \
            anchore/syft@sha256:678bfa565b60f747aac0f8e964fe5588a24445b8d0a480e91f6efd70020dfbb0 \
            "registry:${{ env.IMAGE }}@${{ steps.platforms.outputs.arm64 }}" \
            -o spdx-json=/out/aegis-api-linux-arm64.spdx.json

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.3"

      # Keyless: no private key anywhere. Cosign exchanges this job's OIDC
      # token for a short-lived certificate from Fulcio binding the
      # signature to this exact workflow run, then records it in Rekor.
      # Signs the index digest — the artifact identity Kubernetes and
      # every verification step below actually reference — not the
      # staging tag, which is just a mutable pointer to it.
      - name: Sign the release digest (keyless)
        run: |
          cosign sign --yes "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

      # SBOMs attached as attestations on the same digest: durable in the
      # registry, retrievable independently of this workflow run, and
      # covered by the same keyless signature as the image itself.
      - name: Attach SBOM attestations
        run: |
          cosign attest --yes --type spdxjson \
            --predicate sbom/aegis-api-linux-amd64.spdx.json \
            "${{ env.IMAGE }}@${{ steps.platforms.outputs.amd64 }}"
          cosign attest --yes --type spdxjson \
            --predicate sbom/aegis-api-linux-arm64.spdx.json \
            "${{ env.IMAGE }}@${{ steps.platforms.outputs.arm64 }}"

      # Verify inside the same job, with the identity pinned to this exact
      # workflow file and the tag ref that triggered it — not merely "a
      # signature exists." A verify with no identity constraint proves
      # nothing about who signed it.
      - name: Verify the signature this job just created
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github\.com/nhatminh06/aegis-api/\.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

      # Release tags are immutable from here on. If v0.1.1 already exists,
      # this only proceeds when it already points at the exact digest just
      # built — an idempotent re-run of this same release, not a move.
      - name: Guard semver tag immutability
        id: guard
        run: |
          if existing=$(docker buildx imagetools inspect "${{ env.IMAGE }}:${{ github.ref_name }}" --format '{{json .Manifest.Digest}}' 2>/dev/null); then
            existing=$(echo "$existing" | tr -d '"')
            if [ "$existing" = "${{ steps.build.outputs.digest }}" ]; then
              echo "::notice::${{ github.ref_name }} already points at ${existing} — idempotent re-run, not moving it"
              echo "promote=false" >> "$GITHUB_OUTPUT"
            else
              echo "::error::${{ github.ref_name }} already exists at ${existing}, which is NOT ${{ steps.build.outputs.digest }} — refusing to move an existing release tag" >&2
              exit 1
            fi
          else
            echo "promote=true" >> "$GITHUB_OUTPUT"
          fi

      # Promotion is a tag pointed at the already-built, already-scanned,
      # already-signed digest — never a rebuild. A rebuild here would
      # silently break the equality this milestone's whole point is to
      # guarantee: the digest that was scanned and signed is the digest
      # v0.1.1 actually resolves to.
      - name: Promote the exact digest to the release tag
        if: steps.guard.outputs.promote == 'true'
        run: |
          docker buildx imagetools create --tag "${{ env.IMAGE }}:${{ github.ref_name }}" \
            "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}"

      - name: Release summary
        run: |
          echo "release tag   : ${{ github.ref_name }}"
          echo "index digest  : ${{ steps.build.outputs.digest }}"
          echo "linux/amd64   : ${{ steps.platforms.outputs.amd64 }}"
          echo "linux/arm64   : ${{ steps.platforms.outputs.arm64 }}"
